apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp-deployment
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp-container
          image: scaletestapp:arm64
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "30Mi"
              cpu: "200m"
            requests:
              memory: "20Mi"
              cpu: "100m"
